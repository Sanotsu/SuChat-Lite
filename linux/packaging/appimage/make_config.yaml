# Fastforge appimage maker 配置(Linux AppImage 绿色单文件)
# 文档: https://fastforge.dev/makers/appimage
# 生成命令(仅限 Linux 环境，如 Ubuntu 24): fastforge package --platform linux --targets appimage
#
# Ubuntu 24 环境依赖:
#   sudo apt install locate p7zip-full
#   flutter linux 构建依赖: ninja-build libgtk-3-dev liblzma4(或 liblzma-dev) 等
#   appimagetool:
#     wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
#     chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/
display_name: SuChat

icon: assets/brand.png

generic_name: AI Chat Client

categories:
  - Utility
  - Chat

keywords:
  - SuChat
  - AI
  - Chat
  - LLM

startup_notify: true

# fastforge 会自动扫描并打包依赖的 so；个别缺失时可在此手动指定
include: []
